project_id = "autoempleo-ia"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["autoempleoia://auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 600

[auth.email.template.magic_link]
subject = "Tu código para ingresar a Trabajo YA"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.confirmation]
subject = "Confirmá tu cuenta en Trabajo YA"
content_path = "./supabase/templates/confirmation.html"

[storage]
enabled = true
file_size_limit = "10MiB"
