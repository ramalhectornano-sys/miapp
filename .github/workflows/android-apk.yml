name: APK de prueba de Trabajo YA

on:
  push:
    branches: [trabajo-ya-apk]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trabajo-ya-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    name: Compilar APK autónoma de demostración
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CI: '1'
      EXPO_NO_DOTENV: '1'
      EXPO_PUBLIC_DEMO_MODE: 'true'
      TRABAJO_YA_BUILD_MODE: demo
      # Esta compilación no recibe servicios ni claves, tampoco desde .env.
      EXPO_PUBLIC_BACKEND_URL: ''
      EXPO_PUBLIC_SUPABASE_URL: ''
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ''
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ''

    steps:
      - name: Obtener el proyecto
        uses: actions/checkout@v4

      - name: Detectar la carpeta del proyecto
        id: project
        run: |
          if [[ -f trabajo-ya/mobile/package.json ]]; then
            echo 'mobile_dir=trabajo-ya/mobile' >> "$GITHUB_OUTPUT"
          elif [[ -f mobile/package.json ]]; then
            echo 'mobile_dir=mobile' >> "$GITHUB_OUTPUT"
          else
            echo '::error::No se encuentra el proyecto móvil de Trabajo YA.'
            exit 1
          fi

      - name: Preparar Node.js compatible con Expo SDK 54
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preparar Java para Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar las herramientas de Android
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Instalar Android SDK 36 y herramientas de compilación
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'

      - name: Instalar las dependencias de la app
        working-directory: ${{ steps.project.outputs.mobile_dir }}
        run: npm install --no-audit --no-fund

      - name: Verificar tipos y pruebas de la app
        working-directory: ${{ steps.project.outputs.mobile_dir }}
        run: |
          npm run typecheck
          npm test

      - name: Generar el proyecto Android de Expo
        working-directory: ${{ steps.project.outputs.mobile_dir }}
        run: npx expo prebuild --platform android --no-install

      - name: Comprobar nombre, paquete y firma de prueba
        working-directory: ${{ steps.project.outputs.mobile_dir }}
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import re

          app = json.loads(pathlib.Path('app.json').read_text())['expo']
          assert app['name'] == 'Trabajo YA', 'Nombre inesperado de la app'
          assert app['version'] == '0.3.0', 'Actualizar el nombre del artefacto al cambiar la versión'
          assert app['android']['package'] == 'com.trabajoya.autoempleoia', 'Paquete Android inesperado'
          gradle = pathlib.Path('android/app/build.gradle').read_text()
          assert re.search(r'release\s*\{[\s\S]*?signingConfig\s+signingConfigs\.debug', gradle), 'La APK de prueba debe usar la firma debug generada por Expo'
          assert pathlib.Path('android/app/debug.keystore').is_file(), 'Falta el certificado debug de Expo'
          PY

      - name: Preparar Gradle y su caché
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK con JavaScript y recursos incluidos
        working-directory: ${{ steps.project.outputs.mobile_dir }}/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g' -PreactNativeArchitectures=arm64-v8a,armeabi-v7a :app:assembleRelease

      - name: Verificar la firma y preparar la descarga
        working-directory: ${{ steps.project.outputs.mobile_dir }}
        run: |
          mkdir -p output-apk
          cp android/app/build/outputs/apk/release/app-release.apk output-apk/Trabajo-YA-0.3.0-demo.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs output-apk/Trabajo-YA-0.3.0-demo.apk > output-apk/certificado-prueba.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging output-apk/Trabajo-YA-0.3.0-demo.apk > output-apk/apk-info.txt
          python3 - <<'PY'
          import pathlib
          import re

          info = pathlib.Path('output-apk/apk-info.txt').read_text()
          package_line = info.splitlines()[0]
          expected = {'name': 'com.trabajoya.autoempleoia', 'versionCode': '3', 'versionName': '0.3.0'}
          fields = dict(re.findall(r"(\w+)='([^']*)'", package_line))
          assert all(fields.get(key) == value for key, value in expected.items()), 'Paquete o versión incorrectos en la APK'
          assert "application-label:'Trabajo YA'" in info, 'Nombre incorrecto en la APK'
          PY
          cd output-apk
          sha256sum Trabajo-YA-0.3.0-demo.apk > Trabajo-YA-0.3.0-demo.apk.sha256
          printf '%s\n' "$GITHUB_SHA" > commit-compilado.txt

      - name: Guardar APK, checksum y certificado de prueba
        uses: actions/upload-artifact@v4
        with:
          name: Trabajo-YA-0.3.0-demo
          path: |
            ${{ steps.project.outputs.mobile_dir }}/output-apk/Trabajo-YA-0.3.0-demo.apk
            ${{ steps.project.outputs.mobile_dir }}/output-apk/Trabajo-YA-0.3.0-demo.apk.sha256
            ${{ steps.project.outputs.mobile_dir }}/output-apk/certificado-prueba.txt
            ${{ steps.project.outputs.mobile_dir }}/output-apk/apk-info.txt
            ${{ steps.project.outputs.mobile_dir }}/output-apk/commit-compilado.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publicar la APK verificada como versión de prueba
        working-directory: ${{ steps.project.outputs.mobile_dir }}/output-apk
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag='trabajo-ya-v0.3.0-demo'
          if gh release view "$tag" > /dev/null 2>&1; then
            echo '::error::Ya existe esta versión de prueba. No se reemplazarán sus archivos. Usá una nueva versión o gestioná explícitamente la versión anterior.'
            exit 1
          fi
          cat > release-notes.md <<'EOF'
          APK autónoma de demostración de Trabajo YA 0.3.0 para Android. Descargá Trabajo-YA-0.3.0-demo.apk e instalala en tu celular; no requiere Expo Go.

          Incluye ejemplos identificados, cuatro pestañas, logo y temas claro/oscuro. No conecta IA, Supabase ni Gmail reales y no ejecuta búsquedas ni envía correos. Usa un certificado debug de prueba; no es una publicación de producción.

          Adjuntos: checksum SHA-256, huellas públicas del certificado, información del paquete y commit compilado. La APK fue verificada con apksigner y aapt antes de publicar.
          EOF
          gh release create "$tag" Trabajo-YA-0.3.0-demo.apk Trabajo-YA-0.3.0-demo.apk.sha256 certificado-prueba.txt apk-info.txt commit-compilado.txt --prerelease --target "$GITHUB_SHA" --title 'Trabajo YA 0.3.0 — APK de demostración' --notes-file release-notes.md

      - name: Mostrar instrucciones de descarga
        working-directory: .
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Trabajo YA: APK de prueba

          Descargá **Trabajo-YA-0.3.0-demo** en la sección **Artifacts** de esta ejecución y extraé el ZIP. La aplicación instalable es **Trabajo-YA-0.3.0-demo.apk**.

          También se publica como prerelease **trabajo-ya-v0.3.0-demo** en **Releases**, con el commit compilado y su checksum. Una versión existente nunca se reemplaza automáticamente.

          Esta versión usa ejemplos identificados y firma debug. Incluye el JavaScript y los recursos, por lo que no requiere Expo Go ni mantener un servidor Metro encendido. No conecta IA, Supabase o Gmail reales ni envía correos. El archivo `certificado-prueba.txt` contiene las huellas públicas del certificado usado.
          EOF
